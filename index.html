  <script>

const messages = [    
   "لتلك الفتاة التي تحب ورود التوليب",
  "لتلك الجميلة التي تعشق ادوات التجميل",
  "لتلك القارئة المهووسة بالكتب و الروايات",
 "لتلك الشقية صاحبة الروح الصافية",
  "لذلك الشخص المميز بكل تفاصيله",
    "For\n <h2>💖بسكوتة💖</h2>"
];

let index = 0;
const loveText = document.querySelector(".love-message h4");
const snowfall = document.querySelector(".snowfall");
const fireflies = document.querySelector(".fireflies");
let snowing = false;
let firefliesActive = false;
let pressTimer;
let longPressTriggered = false;
let pendingTapTimer;

function toggleFireflies() {
  firefliesActive = !firefliesActive;
  fireflies.classList.toggle("fireflies--active", firefliesActive);

  if (fireflies.childElementCount === 0) {
    for (let i = 0; i < 24; i += 1) {
      const firefly = document.createElement("span");
      firefly.className = "firefly";
      firefly.style.setProperty("--fly-left", `${8 + Math.random() * 84}%`);
      firefly.style.setProperty("--fly-top", `${25 + Math.random() * 58}%`);
      firefly.style.setProperty("--fly-size", `${0.45 + Math.random() * 0.45}vmin`);
      firefly.style.setProperty("--fly-duration", `${4 + Math.random() * 5}s`);
      firefly.style.setProperty("--fly-delay", `${Math.random() * -8}s`);
      firefly.style.setProperty("--fly-drift-x", `${-12 + Math.random() * 24}vmin`);
      firefly.style.setProperty("--fly-drift-y", `${-10 + Math.random() * 20}vmin`);
      fireflies.appendChild(firefly);
    }
  }
}

function toggleSnowfall() {
  snowing = !snowing;
  snowfall.classList.toggle("snowfall--active", snowing);

  if (snowing && snowfall.childElementCount === 0) {
    for (let i = 0; i < 90; i += 1) {
      const flake = document.createElement("span");
      flake.className = "snowflake";
      flake.style.setProperty("--snow-left", `${Math.random() * 100}%`);
      flake.style.setProperty("--snow-size", `${0.35 + Math.random() * 0.8}vmin`);
      flake.style.setProperty("--snow-duration", `${7 + Math.random() * 9}s`);
      flake.style.setProperty("--snow-delay", `${Math.random() * -15}s`);
      flake.style.setProperty("--snow-drift", `${-10 + Math.random() * 20}vmin`);
      snowfall.appendChild(flake);
    }
  }
}

// Fade-in effect for showing messages
function showMessage(message) {
  loveText.innerHTML = message;
  loveText.classList.add("fade-in");
}

// First message: delay before fade-in
window.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    loveText.classList.remove("hidden-message");
    showMessage(messages[index]);
  }, 6000); // delay before first message appears
});

// A long press toggles snowfall and never changes the message.
document.body.addEventListener("pointerdown", () => {
  longPressTriggered = false;
  pressTimer = setTimeout(() => {
    longPressTriggered = true;
    clearTimeout(pendingTapTimer);
    pendingTapTimer = undefined;
    toggleSnowfall();
  }, 2000);
});

document.body.addEventListener("pointerup", () => clearTimeout(pressTimer));
document.body.addEventListener("pointercancel", () => clearTimeout(pressTimer));

// A normal tap changes the message. A double tap triggers fireflies instead.
document.body.addEventListener("click", () => {
  if (longPressTriggered) {
    longPressTriggered = false;
    return;
  }

  if (pendingTapTimer) {
    clearTimeout(pendingTapTimer);
    pendingTapTimer = undefined;
    toggleFireflies();
    return;
  }

  pendingTapTimer = setTimeout(() => {
    pendingTapTimer = undefined;

    // Fade out old → switch text → fade in new
    loveText.classList.remove("fade-in");
    loveText.classList.add("hidden-message");

    // After fade-out animation finishes
    setTimeout(() => {
      index = (index + 1) % messages.length;

      // Update text BEFORE fading in
      loveText.innerHTML = messages[index];

      // Fade in new message
      loveText.classList.remove("hidden-message");
      loveText.classList.add("fade-in");

    }, 600); // match CSS fade-out duration
  }, 280);
});

</script>
